{% if messages %} {% for message in messages %}
<div
    class="mb-4 flex justify-between items-center rounded-lg p-4 text-sm print:hidden {% if message.tags == 'success' %}bg-green-100 text-green-800{% elif message.tags == 'error' %}bg-red-100 text-red-800{% elif message.tags == 'warning' %}bg-yellow-100 text-yellow-800{% else %}bg-blue-100 text-blue-800{% endif %}"
    role="alert"
>
    <span>{{ message }}</span>

    <button type="button" onclick="this.parentElement.remove()" class="text-lg font-bold">&times;</button>
</div>
{% endfor %} {% endif %}
