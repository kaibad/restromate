{% load humanize %} {% if ready_items %}
<section class="ready-blink rounded-xl border-2 border-green-600 p-4" aria-live="polite">
    <div class="mb-3 flex items-center gap-3 text-green-900">
        <span class="relative flex h-3 w-3">
            <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-green-500 opacity-75"></span>
            <span class="relative inline-flex h-3 w-3 rounded-full bg-green-700"></span>
        </span>
        <h2 class="text-lg font-bold">Ready to serve ({{ ready_items|length }})</h2>
    </div>

    <ul class="space-y-2">
        {% for item in ready_items %}
        <li class="flex items-center justify-between gap-3 rounded-lg bg-white px-4 py-3 shadow-sm">
            <div class="min-w-0">
                <p class="font-semibold text-slate-900">{{ item.quantity }} × {{ item.menu_item.name }}</p>
                <p class="text-sm text-slate-700">Ordered {{ item.order.created_at|naturaltime }}</p>
            </div>

            <button
                type="button"
                data-serve-id="{{ item.pk }}"
                data-serve-name="{{ item.quantity }} × {{ item.menu_item.name }}"
                class="flex shrink-0 items-center gap-2 rounded-lg bg-green-700 px-4 py-2.5 font-semibold text-white hover:bg-green-800"
            >
                <svg
                    class="h-5 w-5"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                    stroke-width="2"
                    aria-hidden="true"
                >
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
                </svg>
                Mark as served
            </button>
        </li>
        {% endfor %}
    </ul>
</section>
{% endif %}
