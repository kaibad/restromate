<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>RestroMate || Login Page</title>

        <!-- Tailwind CSS -->
        <script src="https://cdn.tailwindcss.com"></script>
    </head>

    <body class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
        <div class="w-full max-w-md bg-white p-8 sm:p-10 rounded-2xl shadow-lg shadow-gray-200/60">
            <!-- Header -->
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-gray-900 mb-2">Welcome Back</h1>
                <p class="text-sm text-gray-500">Please enter your details to sign in.</p>
            </div>
            {% if messages %} {% for message in messages %}
            <div
                class="mb-4 rounded-lg p-4 text-sm {% if message.tags == 'success' %} bg-green-100 text-green-800 border border-green-300 {% elif message.tags == 'error' %} bg-red-100 text-red-800 border border-red-300 {% elif message.tags == 'warning' %} bg-yellow-100 text-yellow-800 border border-yellow-300 {% elif message.tags == 'info' %} bg-blue-100 text-blue-800 border border-blue-300 {% endif %}"
            >
                {{ message }}
            </div>
            {% endfor %} {% endif %}

            <!-- Login Form -->
            <form action="#" method="POST" class="space-y-5">
                {% csrf_token %}
                <!-- Username -->
                <div>
                    <label for="username" class="block text-sm font-semibold text-gray-700 mb-2"> Username </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                        class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm text-gray-800 placeholder-gray-400 outline-none transition duration-200 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100"
                    />
                </div>

                <!-- Password -->

                <div>
                    <label for="password" class="block text-sm font-semibold text-gray-700 mb-2"> Password </label>

                    <div class="relative">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                            class="w-full px-4 py-3 pr-12 border border-gray-200 rounded-lg text-sm text-gray-800 placeholder-gray-400 outline-none transition duration-200 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100"
                        />

                        <button
                            type="button"
                            id="togglePassword"
                            class="absolute inset-y-0 right-0 flex items-center px-4 text-gray-400 hover:text-indigo-600 transition"
                            aria-label="Show password"
                        >
                            <!-- Eye Icon -->
                            <svg
                                id="eyeIcon"
                                xmlns="http://www.w3.org/2000/svg"
                                class="w-5 h-5"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                                stroke-width="2"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                                />
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                                />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center gap-2 text-gray-600 cursor-pointer">
                        <input
                            type="checkbox"
                            name="remember-me"
                            class="w-4 h-4 accent-indigo-600 rounded cursor-pointer"
                        />
                        Remember me
                    </label>

                    <a href="#" class="text-indigo-600 font-medium hover:text-indigo-800 transition">
                        Forgot password?
                    </a>
                </div>

                <!-- Login Button -->
                <button
                    type="submit"
                    class="w-full py-3 bg-indigo-600 text-white font-semibold rounded-lg shadow-md shadow-indigo-200 hover:bg-indigo-700 hover:-translate-y-0.5 active:translate-y-0 transition duration-200"
                >
                    Sign In
                </button>
            </form>
        </div>
        <script>
            const passwordInput = document.getElementById("password");
            const togglePassword = document.getElementById("togglePassword");
            const eyeIcon = document.getElementById("eyeIcon");

            togglePassword.addEventListener("click", function () {
                const isPassword = passwordInput.type === "password";

                passwordInput.type = isPassword ? "text" : "password";

                togglePassword.setAttribute("aria-label", isPassword ? "Hide password" : "Show password");

                eyeIcon.innerHTML = isPassword
                    ? `<path stroke-linecap="round" stroke-linejoin="round"
                 d="M3 3l18 18M10.584 10.587a2 2 0 002.828 2.828" />
               <path stroke-linecap="round" stroke-linejoin="round"
                 d="M9.88 5.09A10.8 10.8 0 0112 4.9c4.478 0 8.268 2.943 9.542 7a10.8 10.8 0 01-4.042 5.45M6.61 6.61A10.9 10.9 0 002.458 12c1.274 4.057 5.064 7 9.542 7 1.15 0 2.25-.2 3.27-.57" />`
                    : `<path stroke-linecap="round" stroke-linejoin="round"
                 d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
               <path stroke-linecap="round" stroke-linejoin="round"
                 d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />`;
            });
        </script>
    </body>
</html>
